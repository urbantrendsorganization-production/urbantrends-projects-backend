services:
  backend:
    build: .
    image: urbantrends-blogs-backend
    container_name: urbantrends-blogs-backend-1
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8004:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles

  db:
    image: postgres:16-alpine
    container_name: urbantrends-blogs-db-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-urbantrends_blogs}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-urbantrends_blogs}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  media:
  static:
